generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2001
    end_year: 2005
    description: "The Peugeot 307 was introduced as a replacement for the successful 306, representing a significant shift in design philosophy with a taller, more MPV-influenced profile offering improved interior space. Available in multiple body styles including three and five-door hatchbacks, a station wagon (SW), a sedan (in select markets), and the innovative 307 CC featuring a folding metal hardtop. The exterior design featured Peugeot's distinctive front fascia with a prominent grille between the headlights and swept-back headlights, while the overall proportions emphasized interior volume rather than sporty aesthetics. Powertrain options varied by market but typically included gasoline engines ranging from 1.4L to 2.0L and diesel options from 1.4L to 2.0L HDi, paired with manual or automatic transmissions. The interior offered significantly more headroom than its predecessor, with flexible seating configurations particularly in the SW version which could be ordered with an optional third row. Notable features included dual-zone climate control, a panoramic glass roof on the SW, and improved safety equipment earning it the European Car of the Year award for 2002. The 307 WRC competed in the World Rally Championship starting in 2004, though with some transmission problems. Despite early build quality concerns noted by German Automobile Club statistics, the 307 proved popular with over 3.7 million units sold globally during its lifetime."
  - name: "First Generation (Facelift)"
    start_year: 2005
    end_year: 2008
    description: "In June 2005, the 307 was revised to meet the competition of improved rivals which had been launched since the introduction of the 307 four years earlier. The facelift brought significant exterior changes including restyled headlights, a new bonnet, updated instrument cluster, and most notably the removal of the trademark Peugeot grille between the headlights. The new front design featured a larger air intake as first established on the Peugeot 407, establishing Peugeot's new grille language. Reliability improved significantly with the facelift models becoming more popular and trustworthy according to reviews. Production continued in Europe until 2008, though the model was also built in China through 2014 and Argentina through 2010. The 307 WRC achieved its greatest success during this period with Marcus Grönholm winning Rally Finland in both 2004 and 2005, plus Rally Japan in 2005. Overall the facelifted 307 maintained its position as a practical small family car with improved quality while continuing to offer multiple body styles and efficient powertrains including the 1.6 BioFlex ethanol-capable engine introduced in 2007."
